---
name: CI
"on":
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true
defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test:
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - ubuntu-26.04-arm
          - xcode-27
    defaults:
      run:
        shell: "bash -euo pipefail {0}"
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Check all targets
        run: cargo check --workspace --all-targets
      -
        name: Test workspace
        run: make test
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04-arm, xcode-27]
        shard: [cli, config, render, source, session, other]
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
      PYTHON_CPU_COUNT: 2
      BASE_SHA: "${{ github.event.pull_request.base.sha }}"
      SHARD: "${{ matrix.shard }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Isolate mutation builds
        run: echo "CARGO_HOME=$RUNNER_TEMP/mutation-cargo" >> "$GITHUB_ENV"
      - name: Install cargo-mutants
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-mutants@27.1.0
      - name: Gate selftests
        run: |
          mkdir -p .work/tmp
          TMPDIR="$PWD/.work/tmp" make mutants-gate-test
      - name: Mutation selection and results
        env:
          TMPDIR: "${{ github.workspace }}/.work/tmp"
        run: make mutants-diff BASE="$BASE_SHA" SHARD="$SHARD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-evidence-${{ matrix.os }}-${{ matrix.shard }}
          path: .work/mutants-gate/
          include-hidden-files: true
...
