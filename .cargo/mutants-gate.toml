budget_seconds = 1200
timeout_seconds = 60
build_timeout_seconds = 300
irrelevant = ['*.md', 'docs/**', 'LICENSE']

[[critical]]
file = 'src/main.rs'
[[critical]]
file = 'scrl/src/main.rs'
[[critical]]
file = 'src/config.rs'
[[critical]]
file = 'src/render.rs'
regex = 'has_terminal_controls|strip_terminal_controls_append|push_metadata_line|terminal_control_end'
[[critical]]
file = 'src/source.rs'
[[critical]]
file = 'scrl/src/source.rs'
[[critical]]
file = 'scrl/src/session.rs'
regex = 'Session::(handle|content_rows|max_top|clamp_top|horizontal_shift|draw|draw_help)'

# num_digits(1) reaches zero and remains in the inverted loop forever.
# See docs/deslop-cli-tests.md, numeric layout boundary; reconfirm on each run.
[[confirmed_hangs]]
name = 'src/config.rs:80:13: replace >= with < in num_digits'
file = 'src/config.rs'
sha256 = '5b8cae2e7885853cd87eaf8c3dd36194409f7590c511c19069d3ceb384f50ae6'

# This expression only chooses the initial String capacity; both paths push
# the same characters. See docs/deslop-session-draw.md.
